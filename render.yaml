services:
  - type: web
    name: frotasmart
    runtime: python
    region: virginia
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: FROTASMART_ENV
        value: production
      - key: FROTASMART_DATA_DIR
        value: /var/data
      - key: FROTASMART_PASSWORD
        sync: false
    disk:
      name: frotasmart-data
      mountPath: /var/data
      sizeGB: 1

